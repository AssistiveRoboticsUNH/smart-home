shr_parameters:
  pddl:
    instances:
      LandmarksPerson: {
        type: string_array,
        default_value: [ "bedroom", "inside_not_bedroom", "outside" ],
        description: "all landmarks in protocols",
      }
      LandmarksRobot: {
        type: string_array,
        default_value: [ "home" , "designated_space" ],
        description: "all landmarks in protocols",
      }
      Persons: {
        type: string_array,
        default_value: [ "nathan" ],
        description: "all people in protocols",
      }
    FoodProtocols:
      instances: {
        type: string_array,
        default_value: [ "breakfast", "lunch"],
        description: "food protocols",
      }
      eat_times: {
        type: string_array,
        default_value: [ "09h30m0s/10h00m0s", "12h30m00s/13h30m00s"],
        description: "time that each protocol is triggered",
      }
      remind_automated_food_at_times: {
        type: string_array,
        default_value: [ "0h10m0s", "0h10m0s", "0h10m0s" ],
        description: "time to wait for observation",
      }
      remind_automated_food_at_2_times: {
        type: string_array,
        default_value: [ "0h10m0s", "0h1m0s", "0h10m0s" ],
        description: "time to wait for observation",
      }
    MedicineProtocols:
      instances: {
        type: string_array,
        default_value: [ "noon" ],
        description: "medicine protocols",
      }
      take_medication_time: {
        type: string_array,
        default_value: [ "20h00m0s/21h00m0s" ],
        description: "time that each protocol is triggered",
      }
    SleepReminderProtocols:
      instances: {
        type: string_array,
        default_value: [ "sleep_reminder" ],
        description: "sleep protocols",
      }
      sleep_reminder_times: {
        type: string_array,
        default_value: [ "16h45m0s/18h00m0s" ],
        description: "time that each protocol is triggered",
      }
    GymProtocols:
      instances: {
        type: string_array,
        default_value: [ "gym_reminder" ],
        description: "gym protocols",
      }
      gym_reminder_times: {
        type: string_array,
        default_value: [ "4h30m0s/06h00m0s" ],
        description: "time that each protocol is triggered",
      }
      wait_times: {
        type: string_array,
        default_value: [ "0h10m0s" ],
        description: "time to wait for observation",
      }
    WalkingProtocols:
      instances: {
        type: string_array,
        default_value: [ "walking_reminder" ],
        description: "walking protocols",
      }
      walk_reminder_times: {
        type: string_array,
        default_value: [ "06h00m0s/07h00m0s" ],
        description: "time that each protocol is triggered",
      }

    MoveReminderProtocols:
      instances: {
        type: string_array,
        default_value: [ "move_reminder" ],
        description: "walking protocols",
      }
      move_reminder_times: {
        type: string_array,
        default_value: [ "015h00m0s/015h30m0s" ],
        description: "time that each protocol is triggered",
      }

    InternalCheckReminderProtocols:
      instances: {
        type: string_array,
        default_value: [ "internalcheck_reminder" ],
        description: "internalcheck protocols",
      }
      internalcheck_reminder_times: {
        type: string_array,
        default_value: [ "08h45m0s/09h30m0s" ],
        description: "time that each protocol is triggered",
      }

    PracticeReminderProtocols:
      instances: {
        type: string_array,
        default_value: [ "practice_reminder" ],
        description: "practice protocols",
      }
      walk_reminder_times: {
        type: string_array,
        default_value: [ "07h30m0s/08h30m0s" ],
        description: "time that each protocol is triggered",
      }

    AlertProtocols:
      instances: {
        type: string_array,
        default_value: [ "night_alert" ],
        description: "alert protocols",
      }
      alert_reminder_times: {
        type: string_array,
        default_value: [ "01h00m0s/04h30m0s" ],
        description: "time that each protocol is triggered",
      }

  topics:
    time: {
      type: string,
      default_value: "/protocol_time",
      description: "topic for protocol clock time",
    }
    person_taking_medicine: {
      type: string,
      default_value: "/person_taking_medicine",
      description: "topic for sensor that detect if medication is taken",
    }
    person_eating: {
      type: string,
      default_value: "/person_eating",
      description: "topic for sensor that detect if patient is eating",
    }
    robot_charging: {
      type: string,
      default_value: "/charging",
      description: "topic for smart plug that detect if robot is charging",
    }

  person_tf: {
    type: string,
    default_value: "nathan",
    description: "person tf frame id",
  }
  robot_tf: {
    type: string,
    default_value: "base_link",
    description: "robot tf frame id",
  }











